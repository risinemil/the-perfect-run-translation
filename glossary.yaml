  - en: "Wardrobe"
    ru: "Гардероб"
    notes: "Shapeshifting hero. Translate — 'wardrobe' = гардероб."

  - en: "Ghoul"
    ru: "Гуль"
    notes: "Meta-Gang member. Transliterate."

  - en: "Zanbato"
    ru: "Занбато"
