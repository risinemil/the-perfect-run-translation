# ============================================================================
places:
  - en: "New Rome"
    ru: "Нью-Ром"
    notes: "Main setting. Built on the ruins of Naples. Capital of sin."

  - en: "Rust Town"
    ru: "Ржавый Город"
    notes: "Northern slum district. Translate — descriptive name."

  - en: "the Junkyard"
    ru: "Свалка"
    notes: "Dangerous area in Rust Town."

  - en: "Golden Coast"
    ru: "Золотой Берег"
    notes: "Tourist/casino district. Translate — descriptive name."

  - en: "Dynamis Tower"
    ru: "Башня Динамис"
    notes: "Corporate HQ. Glass spire north of the city."

  - en: "Colosseum Maximus"
    ru: "Колизей Максимус"
    notes: "Modern replica arena."

  - en: "the Midnight Market"
    ru: "Полуночный Рынок"
    notes: "Underground black market."

  - en: "the Bakuto"
    ru: "Бакуто"
    notes: "Casino owned by the Augusti."

# ============================================================================
# POWERS & GENOME SYSTEM
# ============================================================================
powers:
  - en: "Genome"
    ru: "Геном"
    notes: "A person with superpowers gained from Elixirs. Central term."

  - en: "Elixir"
    ru: "Эликсир"
    notes: "Substance that grants superpowers. Multiple types exist."

  - en: "Psycho"
    ru: "Псих"
    notes: "A Genome who has gone insane from their Elixir. Villainous designation."

  - en: "knockoff"
    ru: "подделка"
    notes: "Cheap/inferior version of an Elixir. Gives weaker powers."

  - en: "Bliss"
    ru: "Блаженство"
    notes: "Addictive drug. Translate — it's a meaningful name."

  - en: "save point"
    ru: "точка сохранения"
    notes: "Ryan's time-loop anchor. Video game term."

  - en: "time-stop"
    ru: "остановка времени"
    notes: "Ryan's secondary power. Requires conscious activation."

  - en: "enhanced timing sense"
    ru: "обострённое чувство времени"
    notes: "Ryan's tertiary power. Only works on events already lived through."

  - en: "Genius"
    ru: "Гений"
    notes: "Genome type specializing in invention/technology. Their creations are 'Genius-made'."

  - en: "Genome Wars"
    ru: "Геномные Войны"
    notes: "The apocalyptic conflict caused by Elixirs spreading."

# ============================================================================
# ORGANIZATIONS & FACTIONS
# ============================================================================
organizations:
  - en: "Dynamis"
    ru: "Динамис"
    notes: "Megacorporation controlling New Rome. Sells Elixirs."

  - en: "the Meta-Gang"
    ru: "Мета-Банда"
    notes: "Adam's criminal organization. Also called 'Il Migliore'."

  - en: "Il Migliore"
    ru: "Иль Мильоре"
    notes: "Italian name for the Meta-Gang. Means 'The Best'."

  - en: "the Augusti"
    ru: "Августы"
    notes: "Dynamis ruling family/faction."

  - en: "the Carnival"
    ru: "Карнавал"
    notes: "Leo Hargraves' superhero group. Pro-bono heroes."

  - en: "Private Security"
    ru: "Частная Охрана"
    notes: "New Rome's private security force."

